name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The scheduled run exists to pull new Blog/Labs posts from
  # JuriBuora.github.io via `npm run sync:jekyll`, including posts written
  # ahead that become due that day. Every 30 minutes was 48 rebuilds/day of
  # unchanged content.
  #
  # GitHub runs schedules on a best-effort basis and can skip them: the single
  # daily slot at 05:00 last fired on 11 Sep 2026. Two slots away from the top
  # of the hour raise the odds, but they are not what guarantees a release.
  # scripts/release-due-posts.py, run on the author's Mac, checks that the
  # day's posts are live and starts this workflow when they are not.
  schedule:
    - cron: "23 4 * * *"
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      # Runs after the build so the scrub test can scan dist/, the artifact visitors receive.
      - run: npm test

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
